name: README acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-acceptance
  cancel-in-progress: false
jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intro-bin"
          cd "$RUNNER_TEMP/intro-bin"
          curl -fL --retry 3 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          printf '%s  kind\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d | sha256sum -c -
          curl -fL --retry 3 -o kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          printf '%s  kubectl\n' 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f | sha256sum -c -
          chmod +x kind kubectl
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"
      - name: Offline shell safety fault injection
        run: python3 tests/shell_safety.py
      - name: Execute README with additional acceptance assertions
        run: python3 tests/acceptance.py
      - name: Verify cleanup without deleting unowned clusters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v kind >/dev/null; then
            clusters=$(kind get clusters)
            test -z "$clusters"
          fi
          test ! -e "$GITHUB_WORKSPACE/.intro-kubeconfig"
          nodes=$(docker ps -aq --filter label=io.x-k8s.kind.cluster=intro)
          test -z "$nodes"
